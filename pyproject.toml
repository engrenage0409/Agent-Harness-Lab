[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "Small agent runtime, safe coding tools, and local hybrid RAG"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness", "harness.*", "coding", "coding.*", "rag", "rag.*", "scripts", "scripts.*"]
exclude = ["tests", "tests.*", "runs", "runs.*", "workspace", "workspace.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
