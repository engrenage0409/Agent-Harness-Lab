name: Agent Harness MVP Tests
on:
  pull_request:
  push:
    branches: [feat/coding-agent-feedback-loop]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" fastapi httpx
      - name: Run regression suite (no Qwen, no generated-code execution)
        run: python -m pytest -q
